# ============================================================
# SAR-to-EO Image Translation — Configuration
# Personal project — peak performance build
# ============================================================

model:
  input_channels: 1           # SAR: 1=VV only, 2=VV+VH dual-pol (upgrade → set to 2)
  output_channels: 3          # EO: RGB
  base_ch: 64                 # Legacy field (kept for API compat, not used by ResNet50 encoder)
  use_attention: true         # CBAM on encoder skip connections
  pretrained_encoder: true    # ResNet50 ImageNet pretrained weights
  # ResNet50's stem halves the input at once (256→128), so the shallowest
  # encoder feature is 128×128 and the final 128→256 decoder step has nothing
  # to concatenate — the finest detail gets interpolated rather than recovered.
  # This adds a 3×3 conv over the raw input at full resolution as that skip.
  # Costs ~9.6k params (0.03%). Set false to ablate it.
  full_res_skip: true
  gradient_checkpointing: false  # Set true if OOM on Kaggle (saves ~3GB VRAM, ~20% slower)
  n_scales_D: 3               # Multi-scale discriminator: 1× + 0.5× + 0.25×
  n_layers_D: 3               # PatchGAN depth per scale
  # Phase 1.5 upgrade: set input_channels=2 + vv_vh=true to enable dual polarization
  # Requires dataset with VH channel alongside VV (SEN12MS has both)
  vv_vh_dual_pol: false       # false=VV only (current), true=VV+VH (+0.03-0.05 SSIM)

training:
  epochs: 150                 # More epochs — larger model benefits from longer training
  batch_size: 8               # P100 16GB with fp16 handles batch=8 comfortably
  # Differential learning rates — pretrained encoder needs 10× lower LR
  lr_encoder: 0.00002         # ResNet50 encoder (pretrained — gentle fine-tuning)
  lr_decoder: 0.0002          # Decoder, projections, CBAM (randomly initialised)
  lr_discriminator: 0.0002    # Multi-scale discriminator
  beta1: 0.5                  # Adam β₁ — standard for GANs
  beta2: 0.999                # Adam β₂
  warmup_epochs: 5            # Linear LR warmup (critical for pretrained encoder)
  lr_min: 0.000001            # Cosine decay minimum LR
  gradient_clip_norm: 1.0     # Gradient clipping (prevents GAN training collapse)
  ema_decay: 0.999            # EMA generator weights (used for val + inference)
  mixed_precision: true       # fp16 via torch.amp
  save_freq: 10               # Save periodic checkpoint every N epochs
  val_freq: 5                 # Run validation every N epochs
  # Session caps. `epochs` above stays the TRUE total either way — the cosine
  # LR schedule spans it, so changing it between sessions would rescale the
  # schedule and make the LR jump on resume. These only cap one invocation.
  # Both stop on an epoch boundary with a full checkpoint; rerun to continue.
  session_epoch_limit: null           # stop after N epochs this run
  session_time_limit_minutes: null    # stop after N minutes this run
                                      # e.g. 225 for a 4-hour lab slot with
                                      # 15 min of setup/teardown headroom
  seed: 42

loss:
  lambda_l1: 100.0            # L1 pixel loss weight
  lambda_adv: 1.0             # Adversarial loss weight (multi-scale)
  lambda_fft: 10.0            # FFT frequency loss weight
  lambda_vgg: 10.0            # VGG perceptual loss weight (targets LPIPS directly)
  lambda_ssim: 5.0            # MS-SSIM loss weight (targets SSIM metric directly)

# Ablation control (for research / README comparison):
#   "l1_only"    → Config A: L1 only (baseline)
#   "l1_adv"     → Config B: L1 + multi-scale adversarial
#   "l1_adv_fft" → Config C: + FFT frequency loss
#   "full"       → Config D: + VGG + MS-SSIM (MAIN MODEL)
active_ablation: "full"

data:
  # Dataset source:
  #   "sen12"    — SEN1-2 only (TU Munich, season-split)
  #   "kaggle"   — Kaggle Sentinel-1&2 only
  #   "combined" — Both pooled (recommended for best quality)
  dataset_type: "combined"

  # Split strategy (applies to "kaggle" and "combined"):
  #   "scene"   — 80/10/10 grouped by source scene (RECOMMENDED — leak-free)
  #   "terrain" — terrain-segregated (hardest split, shows generalisation)
  #   "random"  — 80/10/10 over patches. LEAKS: SEN1-2 tiles each scene on a
  #               stride grid, so adjacent patches (p265/p266) overlap on the
  #               ground and land on both sides of the split. Inflates PSNR/SSIM.
  #               Kept only to reproduce pre-fix numbers.
  split_strategy: "scene"

  # SEN1-2 paths
  sen12_root: "./data/SEN1-2"
  train_seasons: ["spring", "summer", "fall"]
  val_seasons: ["winter"]
  test_seasons: ["winter"]

  # Kaggle dataset paths
  kaggle_root: "./data/sentinel12"
  train_terrain: ["agri", "barrenland", "grassland"]   # for terrain split only
  val_terrain: ["urban"]
  test_terrain: ["urban"]

  image_size: 256
  subset_size: null           # null = use all available pairs
  num_workers: 4              # DataLoader worker processes

augmentation:
  horizontal_flip: true       # p=0.5
  vertical_flip: true         # p=0.5
  rotation_90: true           # random 0/90/180/270
  sar_gaussian_noise: true    # σ ~ U[0, 0.05] on SAR only
  eo_brightness_jitter: true  # scale ~ U[0.9, 1.1] on EO only

paths:
  checkpoint_dir: "./checkpoints"
  output_dir: "./outputs"
  log_dir: "./logs"
